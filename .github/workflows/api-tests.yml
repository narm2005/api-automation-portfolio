name: API Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 11 * * 1-5'   # weekday health check against the live APIs
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [graphql, soap, contract]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run ${{ matrix.project }} tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/junit.xml
          retention-days: 14
